<style>
:root{
  --accent:#8b7cff; --accent2:#ff6ad5; --text:#ecebff; --muted:#9a98b8; --base:#0d0c16;
  --panel-rgb:24,22,40; --panel-a:.72; --blur:18px; --radius:14px; --dim:.35;
  --s-join:#3fa9ff; --s-active:#3ddc84; --s-ask:#ffad33; --s-busy:#ff4d5e; --s-off:#5b5a70;
  --t-visitor:#cccccc; --t-new:#1778ff; --t-user:#2bcf5c; --t-known:#ff7b42; --t-trusted:#b18fff;
  --on-accent:#fff; --font:"Segoe UI Variable Text","Segoe UI",system-ui,sans-serif; --gap:12px; --row:10px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--base);color:var(--text);font-family:var(--font);font-size:14px;overflow:hidden}
::selection{background:var(--accent);color:var(--on-accent)}
#bg{position:fixed;inset:0;z-index:0;background-size:cover;background-position:center}
#bg video{width:100%;height:100%;object-fit:cover}
#bgdim{position:fixed;inset:0;z-index:0;background:rgba(0,0,0,var(--dim))}
#app{position:relative;z-index:1;display:grid;grid-template-columns:220px 1fr;height:100vh}
.glass{background:rgba(var(--panel-rgb),var(--panel-a));backdrop-filter:blur(var(--blur)) saturate(1.2);-webkit-backdrop-filter:blur(var(--blur));border:1px solid rgba(255,255,255,.07);border-radius:var(--radius)}
nav{margin:12px 0 12px 12px;padding:16px 10px;display:flex;flex-direction:column;gap:4px}
.logo{font-size:22px;font-weight:800;letter-spacing:.5px;padding:2px 10px 14px;background:linear-gradient(90deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent}
nav button{all:unset;cursor:pointer;display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;color:var(--muted);font-weight:600}
nav button:hover{background:rgba(255,255,255,.06);color:var(--text)}
nav button.on{background:linear-gradient(90deg,color-mix(in srgb,var(--accent) 35%,transparent),transparent);color:var(--text);box-shadow:inset 3px 0 0 var(--accent)}
nav .ico{width:18px;text-align:center}
nav .count{margin-left:auto;font-size:11px;background:var(--accent);color:var(--on-accent);font-weight:800;border-radius:99px;padding:1px 7px}
nav .spacer{flex:1}
.live{font-size:12px;color:var(--muted);padding:8px 12px;display:flex;gap:8px;align-items:center;line-height:1.3}
.dot{width:8px;height:8px;border-radius:50%;background:var(--s-off);flex:none}
.live.ok .dot{background:var(--s-active);box-shadow:0 0 8px var(--s-active)}
.live.stale .dot{background:var(--s-ask)}
main{display:flex;flex-direction:column;min-width:0;padding:12px;gap:12px;height:100vh}
header{display:flex;align-items:center;gap:12px;padding:10px 14px}
header h1{font-size:18px;margin:0;font-weight:700;white-space:nowrap}
.search{flex:1;max-width:460px;margin-left:auto;position:relative}
input,select,textarea{font:inherit;color:var(--text);background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:10px;padding:8px 12px;outline:none}
input:focus,select:focus{border-color:var(--accent)}
select option{background:#1b1a2b}
.search input{width:100%}
#view{flex:1;overflow:auto;padding:2px 4px 40px 2px;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.2) transparent}
.btn{all:unset;cursor:pointer;padding:7px 13px;border-radius:9px;background:rgba(255,255,255,.08);font-weight:600;font-size:13px;white-space:nowrap}
.btn:hover{background:rgba(255,255,255,.14)}
.btn.primary{background:var(--accent);color:var(--on-accent)}
.btn.primary:hover{filter:brightness(1.1)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{all:unset;cursor:pointer;padding:6px 12px;border-radius:99px;font-size:12.5px;font-weight:600;background:rgba(255,255,255,.06);color:var(--muted);border:1px solid transparent}
.chip.on{background:color-mix(in srgb,var(--accent) 28%,transparent);color:var(--text);border-color:color-mix(in srgb,var(--accent) 60%,transparent)}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:var(--gap)}
.muted{color:var(--muted)}
.small{font-size:12px}
h2{font-size:15px;margin:0 0 10px;font-weight:700}
.section{padding:16px;margin-bottom:var(--gap)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:var(--gap)}
.av{width:42px;height:42px;border-radius:12px;flex:none;object-fit:cover;background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center;font-weight:800;color:var(--on-accent);font-size:16px;position:relative}
.av.sm{width:30px;height:30px;border-radius:9px;font-size:12px}
.av.lg{width:84px;height:84px;border-radius:20px;font-size:32px}
.avwrap{position:relative;flex:none}
.avwrap .sdot{position:absolute;right:-3px;bottom:-3px;width:13px;height:13px;border-radius:50%;border:3px solid rgb(var(--panel-rgb))}
.fcard{display:flex;gap:12px;align-items:center;padding:11px 12px;cursor:pointer;transition:transform .12s,background .12s}
.fcard:hover{transform:translateY(-1px);background:rgba(var(--panel-rgb),calc(var(--panel-a) + .06));border-color:color-mix(in srgb,var(--accent) 45%,transparent)}
.fcard .info{min-width:0;flex:1}
.name{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.inst{padding:14px;margin-bottom:var(--gap)}
.inst-h{display:flex;gap:10px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
.inst-h .w{font-weight:800;font-size:15px}
.badge{font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;background:rgba(255,255,255,.1);color:var(--muted);white-space:nowrap}
.badge.acc{background:color-mix(in srgb,var(--accent) 30%,transparent);color:var(--text)}
.members{display:flex;flex-wrap:wrap;gap:8px}
.member{display:flex;gap:8px;align-items:center;padding:6px 10px 6px 6px;border-radius:12px;background:rgba(255,255,255,.05);cursor:pointer;max-width:260px}
.member:hover{background:rgba(255,255,255,.1)}
.rows{display:flex;flex-direction:column}
.row{display:flex;gap:12px;align-items:center;padding:var(--row) 14px;border-bottom:1px solid rgba(255,255,255,.05)}
.row:last-child{border-bottom:0}
.row:hover{background:rgba(255,255,255,.03)}
.row .t{width:104px;flex:none;white-space:nowrap;font-size:12px;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
.row .k{width:84px;flex:none}
.row .body{flex:1;min-width:0}
.ellip{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lnk{cursor:pointer;font-weight:700}
.lnk:hover{text-decoration:underline}
.k-Online{color:var(--s-active)} .k-Offline{color:var(--s-off)} .k-GPS{color:var(--s-join)} .k-Status{color:var(--s-ask)} .k-Avatar{color:var(--accent2)} .k-Bio{color:var(--accent)}
.k-Friend{color:var(--s-active)} .k-Unfriend{color:var(--s-busy)} .k-DisplayName{color:var(--s-join)} .k-TrustLevel{color:var(--t-trusted)} .k-FriendRequest,.k-CancelFriendRequest{color:var(--s-ask)}
.kl{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.5px}
.thumb{width:44px;height:33px;border-radius:6px;object-fit:cover;flex:none;background:rgba(255,255,255,.06)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:var(--gap);margin-bottom:var(--gap)}
.stat{padding:16px}
.stat .v{font-size:28px;font-weight:800;background:linear-gradient(90deg,var(--text),var(--accent));-webkit-background-clip:text;background-clip:text;color:transparent}
.stat .l{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.6px}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:var(--gap)}
@media (max-width:1100px){.cols{grid-template-columns:1fr}}
.bar{height:8px;border-radius:99px;background:rgba(255,255,255,.07);overflow:hidden}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:99px}
table{width:100%;border-collapse:collapse}
td,th{padding:8px 10px;text-align:left;border-bottom:1px solid rgba(255,255,255,.05)}
th{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;font-weight:700}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
#drawer{position:fixed;top:12px;right:12px;bottom:12px;width:min(460px,92vw);z-index:5;transform:translateX(110%);transition:transform .22s ease;overflow:auto;padding:20px}
#drawer.open{transform:none}
#drawer .x{position:absolute;right:14px;top:12px}
#drawer .row{padding:8px 10px;gap:8px}#drawer .row .k{width:62px;font-size:10px}#drawer .row .body{white-space:normal}#drawer .row .t{width:70px;white-space:normal}
.kv{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:14px 0}
.kv>div{background:rgba(255,255,255,.05);border-radius:10px;padding:10px}
.kv b{display:block;font-size:16px}
.kv span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
.bio{white-space:pre-wrap;background:rgba(255,255,255,.04);border-radius:10px;padding:12px;font-size:13px;line-height:1.45;max-height:260px;overflow:auto}
.empty{padding:40px;text-align:center;color:var(--muted)}
.more{display:block;margin:12px auto}
/* theme editor */
.te{display:grid;grid-template-columns:360px 1fr;gap:var(--gap)}
@media (max-width:1100px){.te{grid-template-columns:1fr}}
.field{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:7px 0}
.field label{font-weight:600;font-size:13px}
.field input[type=color]{width:44px;height:30px;padding:2px;border-radius:8px;cursor:pointer}
.field input[type=range]{width:160px;accent-color:var(--accent);padding:0}
.presets{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px}
.preset{cursor:pointer;border-radius:12px;padding:10px;height:70px;display:flex;align-items:flex-end;font-weight:700;font-size:12px;border:2px solid transparent;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.6)}
.preset:hover{border-color:var(--accent)}
.bgs{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px}
.bgs .b{height:70px;border-radius:10px;background-size:cover;background-position:center;cursor:pointer;border:2px solid transparent;overflow:hidden;position:relative}
.bgs .b.on{border-color:var(--accent)}
.bgs .b video{width:100%;height:100%;object-fit:cover}
.drop{border:2px dashed rgba(255,255,255,.2);border-radius:12px;padding:18px;text-align:center;color:var(--muted);cursor:pointer}
.drop.over{border-color:var(--accent);color:var(--text)}
.sw{display:flex;gap:6px;flex-wrap:wrap}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:9;padding:10px 18px;font-weight:600}
.compact{--row:6px}
.hm{display:grid;grid-template-columns:34px repeat(24,1fr);gap:3px;font-size:10px;color:var(--muted)}
.hm i{aspect-ratio:1.4;border-radius:3px;background:var(--accent)}

/* poke + login modal */
#modal{position:fixed;inset:0;z-index:8;background:rgba(0,0,0,.45);display:none;place-items:center}
#modal.open{display:grid}
#modal .box{width:min(560px,94vw);max-height:88vh;overflow:auto;padding:22px;background:rgba(var(--panel-rgb),.95);backdrop-filter:blur(20px)}
#drawer{background:rgba(var(--panel-rgb),max(var(--panel-a),.9))}
.emojis{display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:6px;margin:12px 0}
.emo{all:unset;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 4px;border-radius:12px;border:2px solid transparent;font-size:11px;color:var(--muted);text-align:center}
.emo:hover{background:rgba(255,255,255,.07)}
.emo.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 18%,transparent);color:var(--text)}
.emo .g{font-size:28px;line-height:1}
.emo img{width:44px;height:44px;object-fit:contain}
.pokebtn{all:unset;cursor:pointer;opacity:0;font-size:18px;padding:4px 6px;border-radius:8px;transition:opacity .12s}
.fcard:hover .pokebtn{opacity:.85}
.pokebtn:hover{opacity:1!important;background:rgba(255,255,255,.1)}
.form{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.err{color:var(--s-busy);font-size:13px;min-height:18px}
.acct{font-size:12px;color:var(--muted);padding:6px 12px;cursor:pointer;border-radius:8px}
.acct:hover{background:rgba(255,255,255,.06);color:var(--text)}

.acctcard{display:flex;gap:10px;align-items:center;padding:10px;margin:4px 0;border-radius:12px;background:rgba(255,255,255,.05);cursor:pointer}
.acctcard:hover{background:rgba(255,255,255,.1)}
.acctcard .av{width:36px;height:36px;border-radius:10px}
.signin{all:unset;cursor:pointer;text-align:center;padding:10px;border-radius:12px;font-weight:700;background:linear-gradient(90deg,var(--accent),var(--accent2));color:var(--on-accent);margin:4px 0}
.signin:hover{filter:brightness(1.1)}
.pw{position:relative}.pw input{width:100%}.pw button{all:unset;cursor:pointer;position:absolute;right:10px;top:50%;transform:translateY(-50%);font-size:12px;color:var(--muted)}
body.clearglass #app,body.clearglass #drawer,body.clearglass #modal{text-shadow:0 1px 2px rgba(0,0,0,.85),0 0 6px rgba(0,0,0,.5)}
body.clearglass .btn.primary,body.clearglass .signin,body.clearglass nav .count{text-shadow:none}

.animemo{background-repeat:no-repeat;image-rendering:auto}
.emo .del{position:absolute;top:2px;right:4px;font-size:12px;opacity:0;color:var(--muted)}
.emo{position:relative}.emo:hover .del{opacity:1}.emo .del:hover{color:var(--s-busy)}
.emo.add .g{font-size:30px;color:var(--accent)}
.eprev{width:180px;height:180px;border-radius:16px;background:repeating-conic-gradient(rgba(255,255,255,.06) 0 25%,transparent 0 50%) 0 0/20px 20px;display:grid;place-items:center;overflow:hidden;flex:none}
.erow{display:flex;gap:16px;align-items:flex-start;margin-top:12px}

/* ---------- clean pass ---------- */
html,body{font-size:13.5px;letter-spacing:.005em}
.glass{border:1px solid rgba(255,255,255,.055);box-shadow:0 1px 0 rgba(255,255,255,.03) inset,0 8px 30px rgba(0,0,0,.18)}
#app{grid-template-columns:208px 1fr}
nav{margin:14px 0 14px 14px;padding:18px 10px 12px;gap:2px}
.logo{font-size:18px;font-weight:700;letter-spacing:.2px;padding:0 10px 18px;color:var(--text);background:none;-webkit-background-clip:initial;background-clip:initial}
.logo .mark{color:var(--accent)}
nav button{padding:8px 10px;font-weight:500;gap:11px;border-radius:9px}
nav button .ico{width:18px;height:18px;flex:none;opacity:.85}
nav button.on{background:rgba(255,255,255,.07);box-shadow:none;color:var(--text)}
nav button.on .ico{color:var(--accent);opacity:1}
nav .count{background:transparent;color:var(--muted);font-weight:600;padding:0;font-size:12px}
nav button.on .count{color:var(--accent)}
.live{padding:6px 10px;font-size:11.5px}
main{padding:14px 14px 0 14px;gap:14px}
header{background:none!important;border:0!important;box-shadow:none!important;backdrop-filter:none!important;padding:6px 4px 0}
header h1{font-size:22px;font-weight:650;letter-spacing:-.2px}
.search input{border-radius:99px;padding:8px 16px;background:rgba(var(--panel-rgb),max(var(--panel-a),.5));border-color:rgba(255,255,255,.06)}
.chip{padding:5px 12px;font-weight:500;font-size:12.5px;background:transparent;border-color:rgba(255,255,255,.08)}
.chip:hover{color:var(--text);border-color:rgba(255,255,255,.16)}
.chip.on{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.14);color:var(--text)}
.toolbar{margin-bottom:14px}
.btn{font-weight:500;border-radius:8px;padding:6px 12px}
.btn.primary{font-weight:600}
.badge{background:transparent;padding:0;font-weight:500;font-size:12px;color:var(--muted);border-radius:0}
.badge.acc{background:transparent;color:var(--muted)}
.inst{padding:16px 18px;margin-bottom:12px}
.inst-h{gap:8px;margin-bottom:12px}
.inst-h .w{font-weight:650;font-size:15px}
.inst-h .meta{color:var(--muted);font-size:12px}

.atoast{pointer-events:auto;display:flex;gap:12px;align-items:center;min-width:280px;max-width:380px;padding:12px 14px;cursor:pointer;background:rgba(var(--panel-rgb),.96)!important;animation:tin .25s ease}

@keyframes tin{from{transform:translateY(12px);opacity:0}to{transform:none;opacity:1}}
.toggle{position:relative;width:44px;height:24px;flex:none;appearance:none;-webkit-appearance:none;background:#d9434f;border-radius:99px;cursor:pointer;
  transition:background .2s ease;border:0;padding:0;box-shadow:inset 0 0 0 1px rgba(0,0,0,.25)}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.4);transition:transform .2s cubic-bezier(.3,1.4,.5,1)}
.toggle:checked{background:#2fb866}.toggle:checked::after{transform:translateX(20px)}
.toggle:hover{filter:brightness(1.1)}.toggle:focus-visible{outline:2px solid #fff;outline-offset:2px}

.bub.in{align-self:flex-start;background:rgba(255,255,255,.1);border-bottom-left-radius:4px}

<script>
// ================= utils =================
const $ = (s, el = document) => el.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const api = (p) => fetch(p).then((r) => r.json());
const fmtDur = (ms) => { ms = +ms || 0; const m = Math.round(ms / 60000); if (m < 1) return "<1m"; if (m < 60) return m + "m"; const h = Math.floor(m / 60); if (h < 48) return h + "h " + (m % 60) + "m"; return Math.round(h) + "h"; };

const imgUrl = (u) => "/api/vrc/img?u=" + encodeURIComponent(u);
const perLine = (n) => (n > 16 ? 8 : n > 4 ? 4 : 2);
function emojiTile(e, size) {
  if (!(e.frames > 1)) return `<img src="${imgUrl(e.url)}" loading="lazy" style="width:${size}px;height:${size}px;object-fit:contain">`;
  const p = perLine(e.frames);
  return `<div class="animemo" data-frames="${e.frames}" data-fps="${e.fps || 12}" data-loop="${esc(e.loop)}" data-p="${p}" style="width:${size}px;height:${size}px;background-image:url('${imgUrl(e.url)}');background-size:${p * 100}% ${p * 100}%"></div>`;
}
let animOn = false;
function startEmojiAnim() {
  if (animOn) return; animOn = true;
  const tick = (t) => {
    const els = document.querySelectorAll(".animemo");
    if (!els.length) { animOn = false; return; }
    els.forEach((el) => {
      const n = +el.dataset.frames, fps = +el.dataset.fps, p = +el.dataset.p;
      let f = Math.floor((t / 1000) * fps);
      if (el.dataset.loop === "pingpong") { const c = Math.max(1, 2 * n - 2); f %= c; if (f >= n) f = c - f; } else f %= n;
      const col = f % p, row = Math.floor(f / p);
      el.style.backgroundPosition = `${(col / (p - 1)) * 100}% ${(row / (p - 1)) * 100}%`;
    });
    requestAnimationFrame(tick);
  };
  requestAnimationFrame(tick);
}

const EFFECTS = ["bounce","aura","bats","bees","cloud","confetti","crying","dislike","fire","idea","lasers","like","magnet","mistletoe","money","noise","orbit","pizza","rain","rotate","shake","snow","snowball","spin","splash","stop","zzz"];
const MASKS = ["square","circle","heart","star","flower","pow"];
const EU = {};
window.openEmojiUpload = (backId, backName) => {

async function loadEmojiSource(f) {
  $("#e-err").textContent = ""; $("#edrop").textContent = "Reading " + f.name + "…";
  try {
    EU.frames = []; EU.fps = 12;
    if (f.type.startsWith("video/")) await framesFromVideo(f);
    else if (/gif|webp|png|avif/.test(f.type) && "ImageDecoder" in window) await framesFromAnimatedImage(f);
    if (!EU.frames.length) EU.frames = [await createImageBitmap(f)];
    $("#edrop").textContent = `${f.name} · ${EU.frames.length > 1 ? EU.frames.length + " frames" : "still image"} — click to choose a different file`;
    renderEmojiOpts();
  } catch (e) { console.error(e); $("#edrop").textContent = "Drop an image here, or click to choose"; $("#e-err").textContent = "Couldn't read that file. Try a PNG, JPG or GIF."; }
}
async function framesFromAnimatedImage(f) {
  const dec = new ImageDecoder({ data: await f.arrayBuffer(), type: f.type });
  await dec.tracks.ready; await dec.completed.catch(() => {});
  const count = dec.tracks.selectedTrack?.frameCount || 1;
  if (count < 2) return;
  const n = Math.min(64, count), idx = [...Array(n)].map((_, i) => Math.floor((i * count) / n));
  let dur = 0;
  for (const i of idx) { const { image } = await dec.decode({ frameIndex: i }); dur += image.duration || 100000; EU.frames.push(await createImageBitmap(image)); image.close(); }
  // keep the original speed even if frames were dropped
  EU.fps = Math.max(1, Math.min(64, Math.round(1e6 / ((dur / n) * (count / n)))));
}
async function framesFromVideo(f) {
  const v = document.createElement("video"); v.muted = true; v.src = URL.createObjectURL(f);
  await new Promise((ok, bad) => { v.onloadeddata = ok; v.onerror = bad; });
  const fps = 15, len = Math.min(v.duration || 1, 64 / fps), n = Math.max(2, Math.min(64, Math.round(len * fps)));
  for (let i = 0; i < n; i++) { v.currentTime = (i / n) * len; await new Promise((ok) => (v.onseeked = ok)); EU.frames.push(await createImageBitmap(v)); }
  EU.fps = fps; URL.revokeObjectURL(v.src);
}
function buildSheet() {
  const n = EU.frames.length, anim = n > 1, p = anim ? perLine(n) : 1, cell = 1024 / p;
  const c = document.createElement("canvas"); c.width = c.height = 1024; const g = c.getContext("2d");
  EU.frames.forEach((fr, i) => {
    const x = (i % p) * cell, y = Math.floor(i / p) * cell;
    const s = EU.fit === "cover" ? Math.max(cell / fr.width, cell / fr.height) : Math.min(cell / fr.width, cell / fr.height);
    const w = fr.width * s, h = fr.height * s;
    g.save(); g.beginPath(); g.rect(x, y, cell, cell); g.clip(); g.drawImage(fr, x + (cell - w) / 2, y + (cell - h) / 2, w, h); g.restore();
  });
  EU.sheet = c; return c;
}
function renderEmojiOpts() {
  const anim = EU.frames.length > 1;
  const sheet = buildSheet();
  const url = sheet.toDataURL("image/png");
  const sel = (k, list, label) => `<div class="field"><label>${label}</label><select onchange="EU.${k}=this.value;renderEmojiOpts()">${list.map((v) => `<option value="${v}" ${EU[k] === v ? "selected" : ""}>${v[0].toUpperCase() + v.slice(1)}</option>`).join("")}</select></div>`;
  const prevMask = { circle: "50%", square: "14px" }[EU.mask] || "14px";
  $("#eopts").innerHTML = `<div class="erow">
    <div class="eprev">${anim ? `<div class="animemo" data-frames="${EU.frames.length}" data-fps="${EU.fps}" data-loop="${EU.loop}" data-p="${perLine(EU.frames.length)}" style="width:160px;height:160px;border-radius:${prevMask};background-image:url('${url}');background-size:${perLine(EU.frames.length) * 100}% ${perLine(EU.frames.length) * 100}%"></div>` : `<img src="${url}" style="width:160px;height:160px;border-radius:${prevMask}">`}</div>
    <div style="flex:1">
      <div class="field"><label>Fit</label><select onchange="EU.fit=this.value;renderEmojiOpts()"><option value="contain" ${EU.fit === "contain" ? "selected" : ""}>Show whole image</option><option value="cover" ${EU.fit === "cover" ? "selected" : ""}>Crop to fill</option></select></div>
      ${sel("effect", EFFECTS, "Pop-up effect")}
      ${sel("mask", MASKS, "Shape")}
      ${anim ? `${sel("loop", ["linear", "pingpong"], "Loop")}
      <div class="field"><label>Speed <span class="muted small" id="e-fps">${EU.fps} fps</span></label><input type="range" min="1" max="64" value="${EU.fps}" oninput="EU.fps=+this.value;$('#e-fps').textContent=this.value+' fps';document.querySelectorAll('#eopts .animemo').forEach(e=>e.dataset.fps=this.value)"></div>` : ""}
      <div class="muted small">${anim ? `${EU.frames.length} frames${EU.frames.length === 64 ? " (trimmed to VRChat's 64-frame limit)" : ""}` : "Still emoji"} · the effect plays when someone receives your poke.</div>
    </div></div>`;
  $("#e-go").disabled = false; $("#e-go").style.opacity = 1;
  startEmojiAnim();
}

async function loadChat(scroll) {

  } catch {}
}
async function handleAlert(a) {
  if (!ALERTS) ALERTS = (await api("/api/alerts").catch(() => ({ settings: {} }))).settings;
  const open = () => { window.focus(); if (a.kind === "friendRequest") { prefs.nGroup = "friendreq"; go("notifications"); } else if (a.kind === "invite" || a.kind === "requestInvite" || a.kind === "group") go("notifications"); else if (a.uid) openUser(a.uid); };
  const el = document.createElement("div");
  el.className = "atoast glass";
  el.innerHTML = `${a.uid || a.img ? avatar(a.title, a.img ? proxied(a.img) : "", "sm") : `<div class="av sm">👻</div>`}<div style="min-width:0"><div class="t1 ellip">${esc(a.title)}</div><div class="t2 ellip">${esc(a.body || "")}</div></div><span class="x">✕</span>`;
  el.onclick = (e) => { el.remove(); if (!e.target.classList.contains("x")) open(); };
  $("#toasts").prepend(el);
  setTimeout(() => el.remove(), 8000);
  while ($("#toasts").children.length > 4) $("#toasts").lastChild.remove();
  if (ALERTS.sound) blip();
  vrHud(a);
  if (ALERTS.popups && "Notification" in window && Notification.permission === "granted" && (document.hidden || !document.hasFocus())) {
    try { const n = new Notification(a.title, { body: a.body || "", icon: a.img ? proxied(a.img) : undefined, tag: "soul-" + a.id }); n.onclick = () => { n.close(); open(); }; } catch {}
  }
  if (a.kind !== "test") { if (S.view === "notifications") render(); }
}

// ================= VR =================
let VRS = null;
async function renderVR() {
  const box = $("#vr-box"); if (!box) return;
  const v = await api("/api/vr").catch(() => null); if (!v) return;
  VRS = v.settings;
  const s = v.settings, tog = (k, label, desc) => `<div class="setrow"><div><div>${label}</div>${desc ? `<div class="d">${desc}</div>` : ""}</div><input type="checkbox" class="toggle" ${s[k] ? "checked" : ""} onchange="saveVR('${k}', this.checked)"></div>`;
  box.innerHTML = `<h2>VR</h2>
    <div class="muted small" style="margin-bottom:6px">${!v.windows ? "VR features need Windows." : v.steamvr ? (v.overlay ? "● SteamVR is running — Soul's overlay is on." : "SteamVR is running — starting Soul's overlay…") : "SteamVR isn't running. Soul's overlay starts by itself when it is."}${v.overlayError ? ` <span class="err">${esc(v.overlayError)}</span>` : ""}</div>
    ${tog("enabled", "Show Soul in SteamVR", "A small panel on your wrist and alerts in front of you")}
    ${tog("wrist", "Wrist panel", "Who's online and where you are")}
    <div class="setrow"><div>Wrist</div><select onchange="saveVR('hand', this.value)"><option value="left" ${s.hand === "left" ? "selected" : ""}>Left hand</option><option value="right" ${s.hand === "right" ? "selected" : ""}>Right hand</option></select></div>
    ${tog("hud", "Alerts in front of you", "Pops up for a few seconds when something happens")}
    ${tog("xso", "Also send alerts to XSOverlay")}
    ${tog("ovrt", "Also send alerts to OVR Toolkit")}
    <div style="margin-top:10px"><button class="btn" onclick="fetch('/api/vr/test',{method:'POST'});vrHud({title:'Soul VR alerts are working 👻',body:'This is what alerts look like in VR.'})">Send a test VR alert</button></div>`;
}
window.saveVR = async (k, v) => { VRS = (await postJ("/api/vr", { [k]: v })).settings; renderVR(); };
function vrActive() { return S.vr?.steamvr && VRS?.enabled; }
function roundRect(g, x, y, w, h, r) { g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r); g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath(); }
const cssVar = (n) => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
async function postFrame(which, canvas, showMs) {
  const g = canvas.getContext("2d"), d = g.getImageData(0, 0, canvas.width, canvas.height);
  await fetch("/api/overlay/frame", { method: "POST", headers: { "x-which": which, "x-w": canvas.width, "x-h": canvas.height, "x-show-ms": showMs || 0 }, body: d.data }).catch(() => {});
}
async function vrWrist() {
  if (!vrActive() || !VRS.wrist) return;
  const c = document.createElement("canvas"); c.width = 512; c.height = 512; const g = c.getContext("2d");
  const font = theme.font || "Segoe UI", text = cssVar("--text") || "#fff", muted = cssVar("--muted") || "#aaa", accent = cssVar("--accent") || "#8b7cff";
  g.fillStyle = "rgba(" + (cssVar("--panel-rgb") || "24,22,40") + ",0.92)"; roundRect(g, 0, 0, 512, 512, 36); g.fill();
  g.fillStyle = accent; g.font = `700 30px "${font}"`; g.fillText("Soul", 28, 52);
  g.fillStyle = muted; g.font = `500 22px "${font}"`; g.textAlign = "right"; g.fillText(new Date().toLocaleTimeString([], { hour: "numeric", minute: "2-digit" }), 484, 52); g.textAlign = "left";
  let y = 92;
  const w = await api("/api/where").catch(() => ({}));
  if (w.inWorld) { g.fillStyle = text; g.font = `600 22px "${font}"`; g.fillText(("📍 " + (w.worldName || "World")).slice(0, 34), 28, y); g.fillStyle = muted; g.font = `400 18px "${font}"`; const nf = w.players.filter((p) => p.friend).length; g.fillText(`${w.players.length + 1} here · ${nf} friend${nf === 1 ? "" : "s"}`, 28, y + 24); y += 58; }
  const on = (S.friends || []).filter((f) => f.online && f.location !== "web").sort((a, b) => b.fav - a.fav || (a.name || "").localeCompare(b.name || ""));
  g.fillStyle = muted; g.font = `600 18px "${font}"`; g.fillText(`ONLINE · ${on.length}`, 28, y); y += 14;
  for (const f of on.slice(0, Math.floor((500 - y) / 44))) {
    y += 44;
    g.fillStyle = cssVar(STATUS[f.status] || "--s-active") || "#3ddc84"; g.beginPath(); g.arc(38, y - 7, 7, 0, 7); g.fill();
    g.fillStyle = text; g.font = `600 21px "${font}"`; g.fillText(((f.fav ? "★ " : "") + f.name).slice(0, 24), 56, y);
    g.fillStyle = muted; g.font = `400 16px "${font}"`; g.fillText((f.world || parseLoc(f.location).label || "").slice(0, 40), 56, y + 18);
  }
  await postFrame("wrist", c, 0);
}
async function vrHud(a) {
  if (!vrActive() || !VRS.hud) return;
  const c = document.createElement("canvas"); c.width = 768; c.height = 160; const g = c.getContext("2d");
  const font = theme.font || "Segoe UI";
  g.fillStyle = "rgba(" + (cssVar("--panel-rgb") || "24,22,40") + ",0.95)"; roundRect(g, 0, 0, 768, 160, 32); g.fill();
  g.fillStyle = cssVar("--accent") || "#8b7cff"; roundRect(g, 0, 0, 12, 160, 6); g.fill();
  g.fillStyle = cssVar("--text") || "#fff"; g.font = `700 36px "${font}"`; g.fillText(String(a.title || "").slice(0, 34), 40, 68);
  g.fillStyle = cssVar("--muted") || "#aaa"; g.font = `400 26px "${font}"`; g.fillText(String(a.body || "").slice(0, 48), 40, 112);
  await postFrame("hud", c, 6000);
}
setInterval(vrWrist, 3000);
// ================= window presence =================
// Keeps a live line open to Soul. Closing this window drops it, and Soul shuts down.
function connectPresence() {
  try {
    const ws = new WebSocket(`ws://${location.host}/ws`);
    ws.onclose = () => { if (!S.leaving) setTimeout(connectPresence, 1500); };
    ws.onmessage = (e) => { try { const m = JSON.parse(e.data); if (m.type === "alert") handleAlert(m.alert); } catch {} };
    S.ws = ws;
  } catch {}
}
connectPresence();
// a held lock stops the browser from freezing Soul while it's minimized
try { navigator.locks?.request("soul-keepalive", () => new Promise(() => {})); } catch {}
addEventListener("pagehide", () => { S.leaving = true; });
// ================= boot =================
(async () => {
  const [meta, saved] = await Promise.all([api("/api/meta"), api("/api/theme").catch(() => null)]);
  S.meta = meta; S.dv = meta.dataVersion; setLive(meta.latest);
  theme = { ...THEME_DEFAULT, ...(saved || JSON.parse(localStorage.getItem("soul-theme") || "null") || {}) };
  // one-time: you asked for see-through panels over your background image
  if (!theme.seeThroughV13) { if (theme.bgType === "image" && theme.panelA > .5) Object.assign(theme, { panelA: .22, blur: 0, dim: .05 }); theme.seeThroughV13 = true; saveTheme(); }
  applyTheme();
  await loadFriends();
  refreshAccount().then(() => { poll(); if (VRC.loggedIn && "Notification" in window && Notification.permission === "default" && !prefs.askedPopups) { prefs.askedPopups = true; savePrefs(); Notification.requestPermission(); } if (!VRC.loggedIn && !prefs.loginOffered) { prefs.loginOffered = true; savePrefs(); S.firstRun = true; openLogin(null, VRC.need2fa); } });
  go(prefs.view && TITLES[prefs.view] ? prefs.view : "friends");
  poll();
  setInterval(poll, 4000);
  setInterval(() => refreshAccount(), 5 * 60_000);
})();
</script>
